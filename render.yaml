# Blueprint de Render: una sola web service (imagen Docker autocontenida que
# incluye PostgreSQL adentro). No necesita una base externa.
#
# NOTA: en el plan gratuito el disco es efímero, así que los datos se reinician
# en cada redeploy (vuelven a init.sql). Para conservarlos, agregá un disco
# persistente montado en /var/lib/postgresql/data (planes pagos).
services:
  - type: web
    name: cinesocial
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true
